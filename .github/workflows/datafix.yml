name: Datafix

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'datafix package dir (e.g. datafix/20261026-d3)'
        required: true
        type: string

jobs:
  datafix:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps (parser import for backfills)
        run: pip install pyyaml beautifulsoup4 lxml

      - name: Apply datafix
        run: python3 "${{ inputs.package }}/datafix.py" bukken.db

      - name: Commit DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bukken.db
          if git diff --cached --quiet; then
            echo "no db changes"
          else
            git commit -m "datafix: apply ${{ inputs.package }}"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
