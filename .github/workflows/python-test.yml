name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # バージョンは ruff.toml の想定に合わせて固定（既定ルールセットの
      # 変動で CI が突然赤くなるのを防ぐ）
      - name: Lint with ruff
        run: |
          pip install ruff==0.17.3
          ruff check .

      - name: Run smoke tests
        run: python -m unittest tests.test_smoke -v
