name: Scrape

on:
  schedule:
    # 毎日 JST 07:30 (UTC 22:30) に実行
    - cron: "30 22 * * *"
  workflow_dispatch:  # 手動実行

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: bukken.db
          key: bukken-db-${{ github.run_id }}
          restore-keys: |
            bukken-db-

      - name: List scrape (全駅)
        run: python3 scraper.py --max-pages 3

      - name: Detail scrape (未取得のみ)
        run: python3 detail_scraper.py --limit 80

      - name: Rank
        run: python3 rank.py --max-total 80000 --walk-max 10 | tee rank_out.txt

      - name: Notify (optional)
        if: ${{ env.HAS_WEBHOOK == 'true' }}
        env:
          HAS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK != '' }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 notify.py

      - name: Commit DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bukken.db
          if git diff --cached --quiet; then
            echo "no db changes"
          else
            git commit -m "scrape: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukken-db
          path: |
            bukken.db
            rank_out.txt
          retention-days: 14
